<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Disasters</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
        integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Roboto+Slab:wght@100..900&family=Rubik+Doodle+Shadow&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">






    <style>
        /* Base Styles */
        body {
            background-image: url('/static/bg.png');
            background-size: cover;
            background-attachment: fixed;
            color: #052a5e;
            font-family: 'Nunito', sans-serif;
            
            opacity: 0; 
            animation: fadeIn 1s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Jumbotron Styles */
        .jumbotron {
            background-color: rgba(228, 251, 255, 0.9);
            padding: 50px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
            transform: translateY(-20px);
            opacity: 0;
            animation: slideDown 0.8s ease-out 0.5s forwards;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .jumbotron p {
            font-size: 30px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .jumbotron h1 {
            font-size: 70px;
            font-weight: bold;
            color: #052a5e;
            overflow: hidden;
            white-space: nowrap;
            border-right: 4px solid;
            width: fit-content;
            margin: 0 auto;
            animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* Form Elements */
        .custom-input {
            width: 80%;
            margin: 20px auto;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .custom-input:focus {
            border-color: #052a5e;
            box-shadow: 0 6px 12px rgba(5, 42, 94, 0.3);
            transform: translateY(-2px);
            outline: none;
        }

        /* Button Styles */
        .button-container {
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1.5s forwards;
        }

        .shiny-button {
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            transition: all 0.3s ease;
            margin: 10px;
            padding: 12px 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .shiny-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.2);
        }

        .shiny-button:active {
            transform: translateY(1px);
        }

        .shiny-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(45deg);
            transition: all 0.3s ease;
            opacity: 0;
        }

        .shiny-button:hover::after {
            animation: shine 1s ease-out;
            opacity: 1;
        }

        @keyframes shine {
            from {
                transform: translateX(-100%) rotate(45deg);
            }
            to {
                transform: translateX(100%) rotate(45deg);
            }
        }

        /* Graph Container Styles */
        .graph-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 2s forwards;
        }

        .graph {
            width: 48%;
            min-width: 400px;
            min-height: 400px;
            border-radius: 15px;
            padding: 1px;
            background-color: rgba(175, 241, 255, 0.95);
            box-shadow: 0px 4px 8px rgba(1, 12, 109, 0.502);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .graph::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .graph:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0px 20px 25px rgba(0, 0, 0, 0.4);
            border: 3px solid #0b003d;
        }

        .graph:hover::before {
            opacity: 1;
        }

        /* Page Header Animation */
        .page-header {
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1.8s forwards;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .jumbotron h1 {
                font-size: 40px;
            }
            
            .jumbotron p {
                font-size: 20px;
            }

            .custom-input {
                width: 95%;
            }

            .graph {
                width: 100%;
                min-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="jumbotron">
        <div class="container">
            <h1 class="text-center">
                <a href="/" style="text-decoration: none; color: inherit;">DisasterSense - Did you sense it?</a>
            </h1>
            <p class="text-center">Analyzing message data for disaster response</p>
            <hr />

            <form action="/go" method="get" onsubmit="return validateForm()">
                <input type="text" class="form-control form-control-lg custom-input" name="query"
                    placeholder="Enter a message to classify" id="queryInput">
                <div class="button-container">
                    <button type="button" class="btn btn-lg btn-danger shiny-button" id="testButton">Test</button>
                    <button type="button" class="btn btn-lg btn-info shiny-button" id="nextButton" disabled>Next</button>
                    <button type="submit" class="btn btn-lg btn-success shiny-button">Classify Message</button>
                    <a class="btn btn-lg btn-warning shiny-button" href="http://localhost:8501" role="button">Send help mails</a>
                    <a class="btn btn-lg btn-primary shiny-button" href="http://localhost:3000" role="button">Donate</a>
                </div>
            </form>

            {% block message %}
            {% endblock %}
        </div>
    </div>

    <div class="container">
        {% block content %}
        <div class="page-header" style="border-bottom: 0px">
            <h1 class="text-center" style="font-size: 30px;">Overview of Training Dataset</h1>
        </div>

        <div class="graph-container">
            {% for id in ids %}
            <div id="{{ id }}" class="graph"></div>
            {% endfor %}
        </div>
        {% endblock %}
    </div>

    <script type="text/javascript">
        function validateForm() {
            var queryInput = document.getElementById("queryInput").value;
            if (queryInput.trim() === "") {
                alert("Please enter a message before submitting.");
                return false;
            }
            return true;
        }

        const graphs = {{ graphJSON | safe }};
        const ids = {{ ids | safe }};
        for (let i in graphs) {
            Plotly.plot(ids[i], graphs[i].data, graphs[i].layout);
        }
    </script>

    <script type="text/javascript">
        let descriptions = [];
        let currentIndex = 0;

        document.getElementById("testButton").addEventListener("click", async () => {
            try {
                const response = await fetch("/fetch_descriptions");
                if (response.ok) {
                    descriptions = await response.json();
                    currentIndex = 0;
                    if (descriptions.length > 0) {
                        document.getElementById("queryInput").value = descriptions[currentIndex];
                        document.getElementById("nextButton").disabled = false;
                    } else {
                        alert("No descriptions found in the dataset.");
                    }
                } else {
                    alert("Failed to fetch descriptions.");
                }
            } catch (error) {
                console.error("Error fetching descriptions:", error);
            }
        });

        document.getElementById("nextButton").addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % descriptions.length;
            document.getElementById("queryInput").value = descriptions[currentIndex];
        });
    </script>
</body>

</html>
