<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Disasters</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
        integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Roboto+Slab:wght@100..900&family=Rubik+Doodle+Shadow&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-image: url('/static/bg.png');
            background-size: cover;
            background-attachment: fixed;
            color: #052a5e;
            font-family: "Roboto Slab", serif;
        }

        .jumbotron p {
            font-family: "Pacifico", cursive;
            font-size: 30px;
        }

        .jumbotron h1 {
            font-size: 70px;
            font-weight: bold;
            color: #052a5e;
            font-family: "Rubik Doodle Shadow", system-ui;
            overflow: hidden;
            white-space: nowrap;
            border-right: 4px solid;
            width: fit-content;
            margin: 0 auto;
            animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        .jumbotron {
            background-color: rgba(228, 251, 255, 0.9);
            padding: 50px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
        }

        .custom-input {
            width: 80%;
            margin: 20px auto;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        .shiny-button {
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            transition: transform 0.2s;
            margin: 10px;
        }

        .shiny-button:hover {
            transform: scale(1.05);
        }

        .shiny-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
            transition: left 0.5s;
        }

        .shiny-button:hover::after {
            left: 100%;
        }

        .graph-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        /* .graph {
            width: 48%;
            min-width: 300px;
        } */
        .graph {
            width: 48%;
            min-width: 400px;
            min-height: 400px;
            /* Ensures the graph is visible */
            border-radius: 15px;
            padding: 1px;
            background-color: #aff1ff;
            box-shadow: 0px 4px 8px rgba(1, 12, 109, 0.502);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
            /* Ensures graphs are above any background */
            overflow: hidden;
            /* Prevents content overflow */
        }

        .graph:hover {
            transform: translateY(-5px);
            box-shadow: 0px 20px 20px rgba(0, 0, 0, 0.4), 0px 6px 10px rgba(0, 0, 0, 0.1);
            border: 3px solid #0b003d;
        }
    </style>

</head>

<body>

    <div class="jumbotron">
        <div class="container">
            <h1 class="text-center">
                <a href="/" style="text-decoration: none; color: inherit;">DisasterSense - Did you sense it?</a>
            </h1>
            <p class="text-center">Analyzing message data for disaster response</p>
            <hr />

            <form action="/go" method="get" onsubmit="return validateForm()">
                <input type="text" class="form-control form-control-lg custom-input" name="query"
                    placeholder="Enter a message to classify" id="queryInput">
                <div class="button-container">
                    <button type="button" class="btn btn-lg btn-danger shiny-button" id="testButton">Test</button>
                    <button type="button" class="btn btn-lg btn-info shiny-button" id="nextButton" disabled>Next</button>
                    <button type="submit" class="btn btn-lg btn-success shiny-button">Classify Message</button>
                    <a class="btn btn-lg btn-warning shiny-button" href="http://localhost:8501" role="button">Send help mails</a>
                    <a class="btn btn-lg btn-primary shiny-button" href="http://127.0.0.1:5500/frontend" role="button">Donate</a>
                </div>
            </form>

            {% block message %}
            {% endblock %}
        </div>
    </div>

    <div class="container">
        {% block content %}
        <div class="page-header" style="border-bottom: 0px">
            <h1 class="text-center" style="font-size: 30px;">Overview of Training Dataset</h1>
        </div>

        <!-- <div class="text-center">
            <img src="{{ url_for('static', filename='1d_heatmap.png') }}" alt="Heatmap" class="img-fluid">
        </div>

        <div class="text-center">
            <img src="{{ url_for('static', filename='2d_heatmap.png') }}" alt="Heatmap" class="img-fluid">
        </div> -->

        <div class="graph-container">
            {% for id in ids %}
            <div id="{{ id }}" class="graph"></div>
            {% endfor %}
        </div>
        {% endblock %}
    </div>

    <script type="text/javascript">
        function validateForm() {
            var queryInput = document.getElementById("queryInput").value;
            if (queryInput.trim() === "") {
                alert("Please enter a message before submitting.");
                return false;
            }
            return true;
        }

        const graphs = {{ graphJSON | safe }};
        const ids = {{ ids | safe }};
        for (let i in graphs) {
            Plotly.plot(ids[i], graphs[i].data, graphs[i].layout);
        }
    </script>

    <script type="text/javascript">
        let descriptions = [];
        let currentIndex = 0;

        // Fetch descriptions when "Test" button is clicked
        document.getElementById("testButton").addEventListener("click", async () => {
            try {
                const response = await fetch("/fetch_descriptions");
                if (response.ok) {
                    descriptions = await response.json();
                    currentIndex = 0;
                    if (descriptions.length > 0) {
                        // Set the first description in the input bar
                        document.getElementById("queryInput").value = descriptions[currentIndex];
                        document.getElementById("nextButton").disabled = false;
                    } else {
                        alert("No descriptions found in the dataset.");
                    }
                } else {
                    alert("Failed to fetch descriptions.");
                }
            } catch (error) {
                console.error("Error fetching descriptions:", error);
            }
        });

        // Show the next description when "Next" button is clicked
        document.getElementById("nextButton").addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % descriptions.length;
            // Update the input bar with the next description
            document.getElementById("queryInput").value = descriptions[currentIndex];
        });
    </script>


</body>

</html>
